name: Sync Linux upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/sync-upstream.yml]

permissions:
  contents: write

concurrency:
  group: sync-linux-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MomoNyako/linux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync master from torvalds/linux
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          REPO = "MomoNyako/linux"
          UPSTREAM = "torvalds/linux"
          BRANCH = "master"

          def api(path, data=None):
              request = urllib.request.Request(
                  "https://api.github.com/" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          def head(repo):
              return api(f"repos/{repo}/git/ref/heads/{BRANCH}")["object"]["sha"]

          def contains(upstream_sha, fork_sha):
              comparison = api(f"repos/{REPO}/compare/{upstream_sha}...{fork_sha}")
              return comparison["behind_by"] == 0

          metadata = api(f"repos/{REPO}")
          if not metadata["fork"] or metadata["parent"]["full_name"] != UPSTREAM:
              raise RuntimeError("Fork/upstream identity changed; refusing to sync.")

          before = head(REPO)
          upstream_sha = head(UPSTREAM)
          if contains(upstream_sha, before):
              message = f"Already contains upstream {upstream_sha}. No update needed."
          else:
              # GitHub merges upstream while preserving fork commits.
              # Conflicts fail the job; no force push or reset is used.
              result = api(f"repos/{REPO}/merge-upstream", {"branch": BRANCH})
              after = head(REPO)
              if not contains(upstream_sha, after):
                  raise RuntimeError("Verification failed: upstream commit is not included.")
              message = (
                  f"Synced {UPSTREAM}:{BRANCH}\n"
                  f"Before: {before}\nAfter: {after}\n"
                  f"Upstream: {upstream_sha}\n"
                  f"Result: {result.get('message', 'Synced')}"
              )

          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
